<h1>Detector de Tipo de Rostro</h1>

<video id="video" autoplay muted></video>

<div id="resultado">
Detectando rostro...
</div>

<script>

const video = document.getElementById("video");
const resultado = document.getElementById("resultado");

async function iniciarCamara(){

const stream = await navigator.mediaDevices.getUserMedia({
video:true
});

video.srcObject = stream;

}

async function cargarModelos(){

await faceapi.nets.tinyFaceDetector.loadFromUri(
'https://justadudewhohacks.github.io/face-api.js/models'
);

await faceapi.nets.faceLandmark68Net.loadFromUri(
'https://justadudewhohacks.github.io/face-api.js/models'
);

}

function analizarRostro(){

setInterval(async ()=>{

const deteccion = await faceapi.detectSingleFace(
video,
new faceapi.TinyFaceDetectorOptions()
).withFaceLandmarks();

if(deteccion){

const jaw = deteccion.landmarks.getJawOutline();

const ancho = jaw[16].x - jaw[0].x;

const alto = jaw[8].y - deteccion.landmarks.getLeftEye()[0].y;

let tipo = "";

if(alto > ancho * 1.5){

tipo = "Rostro Alargado";

}else if(ancho > alto){

tipo = "Rostro Redondo";

}else{

tipo = "Rostro Ovalado";

}

resultado.innerHTML = "Tu tipo de rostro es: " + tipo;

}

},3000);

}

async function iniciar(){

await cargarModelos();
await iniciarCamara();
analizarRostro();

}

iniciar();

</script>
