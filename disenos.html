<title>Galería de Diseños | Barbería Maranatha</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
}

/* HEADER */

header{
background:#0E2560;
padding:40px;
text-align:center;
color:white;
}

header h1{
font-size:50px;
}

/* MENU */

nav{
background:#003CFF;
padding:18px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 20px;
font-size:20px;
font-weight:bold;
transition:0.3s;
}

nav a:hover{
color:#8bb6ff;
}

/* TITULO */

.titulo{
text-align:center;
padding:70px 20px 30px;
}

.titulo h2{
font-size:50px;
color:#0E2560;
}

.titulo p{
font-size:22px;
margin-top:15px;
color:#333;
}

/* GALERIA */

.galeria{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
gap:25px;
padding:40px;
}

.galeria img{
width:100%;
height:320px;
object-fit:cover;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
transition:0.3s;
cursor:pointer;
}

.galeria img:hover{
transform:scale(1.03);
box-shadow:0 0 20px rgba(14,37,96,0.5);
}

/* FOOTER */

footer{
background:#0E2560;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>
</head>
