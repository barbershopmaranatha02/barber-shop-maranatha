<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Maranatha</title>

    <style>
     
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        /* HEADER */

        header{
            background:#001F54;
            color:white;
            text-align:center;
            padding:40px 20px;
        }

        header img{
            width:140px;
            height:140px;
            border-radius:50%;
            margin-bottom:15px;
            border:4px solid white;
        }

        header h1{
            font-size:50px;
        }

        /* MENU */

        nav{
            background:#003CFF;
            padding:18px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 25px;
            font-size:20px;
            font-weight:bold;
            transition:0.3s;
        }

        nav a:hover{
            color:#001f33;
        }

        /* HERO */

        .hero{
            background:#e6f4ff;
            text-align:center;
            padding:90px 20px;
        }

        .hero h2{
            font-size:55px;
            color:#0077cc;
            margin-bottom:20px;
        }

        .hero p{
            font-size:25px;
            color:#333;
        }

        /* SERVICIOS */

        .productos{
            padding:70px 20px;
            text-align:center;
        }

        .productos h2{
            font-size:45px;
            margin-bottom:40px;
            color:#0077cc;
        }

        .cards{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:30px;
        }

        .card{
            background:white;
            width:300px;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .card img{
            width:100%;
            height:250px;
            object-fit:cover;
        }

        .card h3{
            color:#0077cc;
            margin:20px 0 10px;
            font-size:28px;
        }

        .card p{
            padding:0 15px 20px;
            color:#444;
        }

        /* FOOTER */

        footer{
            background:#0077cc;
            color:white;
            text-align:center;
            padding:25px;
            margin-top:50px;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header>

        <img src="logo.png">

        <h1>Barber Shop</h1>
        <h3>"Cambia tu look y eleva tu actitud"</h3>

    </header>

    <!-- MENU -->

    <nav>

        <a href="index.html">Inicio</a>

        <a href="cortes.html">Tipos de cortes</a>

        <a href="disenos.html">Diseños</a>

        <a href="barbas.html">Barbas</a>

        <a href="camaraa2.html">Rostro</a>

        <a href="contacto2.html">Contacto</a>

    </nav>

    <!-- HERO -->

    <section class="hero">

        <h2>¡Cortes irresistibles!</h2>

       

    </section>
       
    </section>

    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Barbería Maranatha | Todos los derechos reservados
        </p>

    </footer>


</body>
</html>
