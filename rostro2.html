<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Detector de Rostro</title>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
margin:0;
}

h1{
background:#0E2560;
color:white;
padding:30px;
margin:0;
}

video{
width:350px;
margin-top:40px;
border-radius:20px;
border:5px solid #0E2560;
}

#resultado{
margin-top:30px;
font-size:30px;
font-weight:bold;
color:#0E2560;
}

</style>
</head>

<body>

<h1>Detector de Tipo de Rostro</h1>

<video id="video" autoplay muted></video>

<div id="resultado">
Detectando rostro...
</div>

<script>

const video = document.getElementById("video");
const resultado = document.getElementById("resultado");

async function iniciarCamara(){

const stream = await navigator.mediaDevices.getUserMedia({
video:true
});

video.srcObject = stream;

}

async function cargarModelos(){

await faceapi.nets.tinyFaceDetector.loadFromUri(
'https://justadudewhohacks.github.io/face-api.js/models'
);

await faceapi.nets.faceLandmark68Net.loadFromUri(
'https://justadudewhohacks.github.io/face-api.js/models'
);

}

function analizarRostro(){

setInterval(async ()=>{

const deteccion = await faceapi.detectSingleFace(
video,
new faceapi.TinyFaceDetectorOptions()
).withFaceLandmarks();

if(deteccion){

const jaw = deteccion.landmarks.getJawOutline();

const ancho = jaw[16].x - jaw[0].x;

const alto = jaw[8].y - deteccion.landmarks.getLeftEye()[0].y;

let tipo = "";

if(alto > ancho * 1.5){

tipo = "Rostro Alargado";

}else if(ancho > alto){

tipo = "Rostro Redondo";

}else{

tipo = "Rostro Ovalado";

}

resultado.innerHTML = "Tu tipo de rostro es: " + tipo;

}

},3000);

}

async function iniciar(){

await cargarModelos();
await iniciarCamara();
analizarRostro();

}

iniciar();

</script>

</body>
</html>
