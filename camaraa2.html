<h1>📸 Detector de Tipo de Rostro</h1>

<video id="video" autoplay playsinline></video>

<div id="resultado">
Esperando cámara...
</div>

<script>

const videoElement = document.getElementById('video');
const resultado = document.getElementById('resultado');

let ultimoResultado = "";

function distancia(a,b){
    return Math.sqrt(
        Math.pow(a.x - b.x,2) +
        Math.pow(a.y - b.y,2)
    );
}

const faceMesh = new FaceMesh({
    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }
});

faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
});

faceMesh.onResults((results)=>{

    if(!results.multiFaceLandmarks.length){
        resultado.innerHTML = "❌ No se detecta rostro";
        return;
    }

    const puntos = results.multiFaceLandmarks[0];

    // Anchura aproximada
    const izquierda = puntos[234];
    const derecha = puntos[454];

    // Altura aproximada
    const frente = puntos[10];
    const barbilla = puntos[152];

    const ancho = distancia(izquierda,derecha);
    const alto = distancia(frente,barbilla);

    const ratio = alto/ancho;

    let tipo = "";
    let corte = "";

    if(ratio > 1.55){
        tipo = "Rostro Alargado";
        corte = "Fade medio y volumen lateral";
    }
    else if(ratio > 1.40){
        tipo = "Rostro Ovalado";
        corte = "Quiff, Pompadour o cualquier estilo";
    }
    else if(ratio > 1.25){
        tipo = "Rostro Redondo";
        corte = "Fade alto con volumen arriba";
    }
    else{
        tipo = "Rostro Cuadrado";
        corte = "Crew Cut o Undercut";
    }

    const texto = `
        <h2>✅ Resultado</h2>
        <p><b>${tipo}</b></p>
        <p>✂️ ${corte}</p>
    `;

    if(texto !== ultimoResultado){
        resultado.innerHTML = texto;
        ultimoResultado = texto;
    }

});

const camera = new Camera(videoElement, {
    onFrame: async () => {
        await faceMesh.send({image: videoElement});
    },
    width: 640,
    height: 480
});

camera.start();

</script>
