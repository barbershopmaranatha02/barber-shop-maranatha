}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
text-align:center;
color:#0E2560;
margin:20px 0 10px;
font-size:30px;
}

.card p{
padding:0 15px 25px;

}
